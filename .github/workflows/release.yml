name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v3.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  version:
    name: Determine release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate and create version tag
        id: version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ -n "$MANUAL_VERSION" ]; then
            CLEAN="${MANUAL_VERSION#v}"
          else
            LATEST_TAG="$(git tag --list 'v*' --sort=-version:refname | head -n 1)"
            if [ -z "$LATEST_TAG" ]; then
              LATEST_TAG="v0.0.0"
              RANGE="HEAD"
            else
              RANGE="${LATEST_TAG}..HEAD"
            fi

            COMMITS="$(git log --format='%s%n%b' "$RANGE")"
            if grep -Eq 'BREAKING CHANGE:|BREAKING-CHANGE:|^[^[:space:]]+!:' <<< "$COMMITS"; then
              BUMP="major"
            elif grep -Eq '^feat(\([^)]*\))?:' <<< "$COMMITS"; then
              BUMP="minor"
            else
              BUMP="patch"
            fi

            IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST_TAG#v}"
            case "$BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac
            CLEAN="${MAJOR}.${MINOR}.${PATCH}"
          fi

          TAG="v${CLEAN}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"

          echo "version=${CLEAN}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Releasing MobRig ${TAG}"

  build:
    name: Build (${{ matrix.asset_name }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            asset_name: mobrig-windows-amd64.exe
            cgo_enabled: "0"
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            asset_name: mobrig-linux-amd64
            cgo_enabled: "1"
          - os: macos-latest
            goos: darwin
            goarch: arm64
            asset_name: mobrig-darwin-arm64
            cgo_enabled: "1"
          - os: macos-latest
            goos: darwin
            goarch: amd64
            asset_name: mobrig-darwin-amd64
            cgo_enabled: "1"
            cc: "clang -arch x86_64"
            cxx: "clang++ -arch x86_64"
            cgo_cflags: "-arch x86_64"
            cgo_ldflags: "-arch x86_64"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build UI assets
        working-directory: ui
        run: npm run build

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo rm -f /etc/apt/sources.list.d/*chrome* /etc/apt/sources.list.d/*google*
          sudo apt-get update -q || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build release binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo_enabled }}
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          CGO_CFLAGS: ${{ matrix.cgo_cflags }}
          CGO_LDFLAGS: ${{ matrix.cgo_ldflags }}
        run: |
          go build -trimpath -ldflags "-s -w -X github.com/TheJenilDGohel/MobRig/internal/config.Version=${{ needs.version.outputs.version }}" -o ${{ matrix.asset_name }} ./cmd/mobrig

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: |
          sha256sum mobrig-* > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          tag_name: ${{ needs.version.outputs.tag }}
          name: MobRig ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
